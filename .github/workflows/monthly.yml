name: Monthly ETF Analysis

on:
  schedule:
    - cron: "0 22 1 * *"     # 10pm ET on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monthly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run monthly ETF analysis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ETRADE_CONSUMER_KEY: ${{ secrets.ETRADE_CONSUMER_KEY }}
          ETRADE_CONSUMER_SECRET: ${{ secrets.ETRADE_CONSUMER_SECRET }}
          ETRADE_SANDBOX: ${{ secrets.ETRADE_SANDBOX }}
        run: python scheduler.py monthly
      - name: Commit results
        run: |
          git config user.name "stock-model-bot"
          git config user.email "bot@stock-model"
          git add data/
          git diff --staged --quiet || git commit -m "chore: monthly ETF analysis $(date +'%Y-%m-%d')"
          git pull origin master --rebase
          git push
