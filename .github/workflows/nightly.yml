name: Nightly Analysis

on:
  schedule:
    - cron: "30 22 * * 0-4"  # 10:30pm ET Sun–Thu (after weekly run on Sun)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run nightly analysis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ETRADE_CONSUMER_KEY: ${{ secrets.ETRADE_CONSUMER_KEY }}
          ETRADE_CONSUMER_SECRET: ${{ secrets.ETRADE_CONSUMER_SECRET }}
          ETRADE_SANDBOX: ${{ secrets.ETRADE_SANDBOX }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python scheduler.py nightly
      - name: Commit results
        run: |
          git config user.name "stock-model-bot"
          git config user.email "bot@stock-model"
          tar -czf /tmp/new_data.tar.gz data/
          for i in 1 2 3; do
            git fetch origin master
            git reset --hard origin/master
            tar -xzf /tmp/new_data.tar.gz
            git add data/
            git diff --staged --quiet || git commit -m "chore: nightly analysis $(date +'%Y-%m-%d')"
            git push && break
          done
